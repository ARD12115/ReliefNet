# GitHub Actions CI Pipeline — Generated by imp_fullstack

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/reliefnet_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          OSRM_URL: http://localhost:5000

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: npm run build && { npx serve -s dist -l 3000 & } ; sleep 5
      - name: Run visual regression
        run: node .hermes/features/imp_fullstack/scripts/visual-regression.js baseline --url=http://localhost:3000 && node .hermes/features/imp_fullstack/scripts/visual-regression.js compare --url=http://localhost:3000
        continue-on-error: true
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: visual-diff/
          retention-days: 7

  a11y:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: npm run build && { npx serve -s dist -l 3000 & } ; sleep 5
      - name: Run a11y audit
        run: node .hermes/features/imp_fullstack/scripts/a11y-audit.js --url=http://localhost:3000
        continue-on-error: true
      - name: Upload a11y results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: a11y-audit-results/
          retention-days: 7

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend ./server
      - name: Build frontend image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend ./client
      - name: Test docker-compose
        run: docker-compose config --quiet
      - name: Scan images (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, test, visual, a11y, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "Deploy logic here"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, visual, a11y, docker]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "CI Pipeline Complete"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Visual: ${{ needs.visual.result }}"
          echo "A11y: ${{ needs.a11y.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          if [[ "${{ needs.lint.result }}" != "success" ]] || [[ "${{ needs.test.result }}" != "success" ]]; then exit 1; fi
