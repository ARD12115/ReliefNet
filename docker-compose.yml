services:
  postgres:
    image: postgres:15-alpine
    container_name: reliefnet-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=reliefnet
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reliefnet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.0
    container_name: reliefnet-osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: >
      bash -c "
        apt-get update && apt-get install -y --no-install-recommends curl 2>/dev/null || true;
        if [ ! -f /data/india-latest.osrm ] && command -v curl >/dev/null 2>&1; then
          echo 'Downloading India map extract...';
          curl -L -o /data/india-latest.osm.pbf 'https://download.geofabrik.de/asia/india-latest.osm.pbf';
          osrm-extract -p /opt/car.lua /data/india-latest.osm.pbf;
          osrm-partition /data/india-latest.osrm;
          osrm-customize /data/india-latest.osrm;
        fi;
        osrm-routed --algorithm mld /data/india-latest.osrm || true
        while true; do sleep 3600; done
      "
    healthcheck:
      test: ["CMD", "sh", "-c", "command -v curl >/dev/null 2>&1 && curl -f http://localhost:5000/route/v1/driving/77.5946,12.9716;77.6046,12.9816 || true"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: reliefnet-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/reliefnet
      - REDIS_URL=redis://redis:6379
      - OSRM_URL=http://osrm:5000
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_REFRESH_SECRET=your-refresh-secret-change-in-production
      - PORT=4000
      - CLIENT_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: reliefnet-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_SOCKET_URL=http://localhost:4000
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
